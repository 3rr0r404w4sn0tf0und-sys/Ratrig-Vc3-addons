[mcu host]
serial: /tmp/klipper_host_mcu

[manual_stepper Scraper]
step_pin: host:gpio20
dir_pin: host:gpio21
enable_pin: !host:gpio16
microsteps: 32
rotation_distance: 360
velocity: 30
accel: 100
endstop_pin: !host:gpio23

[gcode_macro SCRAPER_HOME]
gcode:
  G28 X Y Z
  G90
  G1 Z30 F600; Z30 is just a stand-in as to not crash into the bed; change it to whatever is safe once installed
  MANUAL_STEPPER STEPPER=Scraper ENABLE=1
  MANUAL_STEPPER STEPPER=Scraper SET_POSITION=0
  MANUAL_STEPPER STEPPER=Scraper MOVE=30 SPEED=30
  MANUAL_STEPPER STEPPER=Scraper SET_POSITION=120
  MANUAL_STEPPER STEPPER=Scraper MOVE=0 SPEED=15 STOP_ON_ENDSTOP=home

[gcode_macro SCRAPE_SWEEP]
gcode:
  {% set INITIAL_TOOL = params.INITIAL_TOOL|default(0)|int %}
  {% set TEMP = params.TEMP|default(0)|float %}
  {% if TEMP < 150 %}
    {action_raise_error("SCRAPE_SWEEP needs TEMP=<print temperature>")}
  {% endif %}
  SAVE_GCODE_STATE NAME=scrape_sweep
  SCRAPER_HOME
  G90
  G1 Z30 F600
  G1 X400 Y380 Z30 F600; Change this to wherever you put the scraper
  MANUAL_STEPPER STEPPER=Scraper MOVE=90 SPEED=30
  MMU_CHANGE_TOOL STANDALONE=1 TOOL={INITIAL_TOOL}
  M83
  G1 E50 F300
  M104 S255
  G4 P15000
  M107
  G1 X0 Y0 F6000
  MANUAL_STEPPER STEPPER=Scraper MOVE=0 SPEED=30
  MANUAL_STEPPER STEPPER=Scraper enable=0
  M109 S{TEMP}
  RESTORE_GCODE_STATE NAME=scrape_sweep
